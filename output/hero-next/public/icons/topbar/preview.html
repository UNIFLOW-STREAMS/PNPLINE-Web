<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>PNPLINE Topbar Icons</title>
<style>
:root{color-scheme:only light;background:#fff}
*{box-sizing:border-box}
body{font:15px/1.5 system-ui,sans-serif;margin:48px auto;max-width:960px;padding:0 24px;color:#101c29;background:#fff}
h1{font-size:28px;margin:0 0 10px}
p{color:#526170;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:20px}
.item{padding:20px;border:1px solid #dce2e5;background:#fff}
.icon-frame{display:grid;place-items:center;width:72px;height:72px;margin:0 0 18px;background:#fff;border:1px solid #e5eaf0}
.icon-frame.dark{background:#101c29;border-color:#101c29}
.icon-frame img{display:block;width:48px;height:48px}
.label{display:block;font-weight:600;color:#101c29}
a{display:inline-block;margin-top:4px;color:#007096;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>PNPLINE 톱바 아이콘</h1>
<p>아이콘을 흰색 또는 짙은 배경 위에 표시합니다. 파일 이름을 누르면 SVG를 내려받을 수 있습니다.</p>
<div class="grid">
<div class="item"><div class="icon-frame"><img src="warehouse.svg" alt="창고"></div><span class="label">창고</span><a href="warehouse.svg" download>warehouse.svg</a></div>
<div class="item"><div class="icon-frame"><img src="freight-ship.svg" alt="해상운송"></div><span class="label">해상운송</span><a href="freight-ship.svg" download>freight-ship.svg</a></div>
<div class="item"><div class="icon-frame"><img src="distribution-truck.svg" alt="미국 내 배송"></div><span class="label">미국 내 배송</span><a href="distribution-truck.svg" download>distribution-truck.svg</a></div>
<div class="item"><div class="icon-frame"><img src="customs-document.svg" alt="통관"></div><span class="label">통관</span><a href="customs-document.svg" download>customs-document.svg</a></div>
<div class="item"><div class="icon-frame"><img src="arrow-right.svg" alt="오른쪽 화살표"></div><span class="label">오른쪽 화살표</span><a href="arrow-right.svg" download>arrow-right.svg</a></div>
<div class="item"><div class="icon-frame dark"><img src="arrow-up-right.svg" alt="대각선 화살표"></div><span class="label">대각선 화살표</span><a href="arrow-up-right.svg" download>arrow-up-right.svg</a></div>
<div class="item"><div class="icon-frame"><img src="chevron-up.svg" alt="위쪽 꺾쇠"></div><span class="label">위쪽 꺾쇠</span><a href="chevron-up.svg" download>chevron-up.svg</a></div>
<div class="item"><div class="icon-frame"><img src="close.svg" alt="닫기"></div><span class="label">닫기</span><a href="close.svg" download>close.svg</a></div>
</div>
</body>
</html>
