<script>const v=document.querySelector('#movie');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.currentTime=+b.dataset.time;v.play()});document.querySelector('#rate').onclick=function(){v.playbackRate=v.playbackRate===1?.5:1;this.textContent=v.playbackRate===1?'0.5배속':'1배속'};document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{document.querySelector('#overview').src='preview/'+b.dataset.image+'.png';document.querySelectorAll('[data-image]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{document.querySelector('#comparison').src='preview/arrival-'+b.dataset.compare+'.png';document.querySelectorAll('[data-compare]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))})</script></html>
