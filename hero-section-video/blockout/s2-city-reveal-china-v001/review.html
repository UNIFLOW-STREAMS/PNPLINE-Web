<h1>S2 도시와 CHINA 공개 — 경계 유지 결과본</h1><p>원본 12fps · f84–480 · 33.083초. CHINA 배치는 두 비교본에서 동일합니다. 결과 SHA256: b043cfbb…f18132d2. 공동 공개 f144–170.</p>

<pre id="audit"></pre><h2>연속 프레임</h2><img src="review/sequence.png"><p><a href="report.md">판정 보고서</a></p>
<script>const videos=[...document.querySelectorAll('video')],v=document.getElementById('result'),audit=document.getElementById('audit');let history=[];
function record(action){history.push({action,time:v.currentTime,rate:v.playbackRate,at:new Date().toISOString()});update()}
function play(rate,time){for(const x of videos){x.playbackRate=rate;x.currentTime=time;x.play()}record('play')}
function stop(){for(const x of videos)x.pause();record('pause')}
function seek(frame){stop();for(const x of videos)x.currentTime=(frame-84+.5)/12;record('seek '+frame)}
function update(){audit.textContent=JSON.stringify({history,currentTime:v.currentTime,frame:84+Math.floor(v.currentTime*12),rate:v.playbackRate,ended:v.ended,paused:v.paused,error:v.error,played:Array.from({length:v.played.length},(_,i)=>[v.played.start(i),v.played.end(i)]),quality:v.getVideoPlaybackQuality()},null,2)}
v.addEventListener('ended',()=>record('ended'));setInterval(update,500);</script></html>
