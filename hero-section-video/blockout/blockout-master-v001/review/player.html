<!doctype html><html lang="ko"><meta charset="utf-8"><title>PNPLINE v001 continuous preview review</title>
<style>body{margin:0;background:#17212a;color:#e9edf0;font:16px system-ui}main{max-width:1100px;margin:20px auto}video{width:100%;background:#000}button{padding:8px 14px;margin:3px;background:#344c5e;color:white;border:0}p{font-size:14px}output{font-variant-numeric:tabular-nums}</style>
<main><p>7구간 연출안 검증용 / 기존 #61 승인안 대체 아님 · v001 · 12 FPS · 텍스트 기반 후보</p><video id="v" controls muted playsinline preload="auto" src="../preview/master-v001.mp4"></video><div id="buttons"></div><p><output id="status">로딩 중</output></p><p>손동작·포장 봉함·장비 상세 작동은 미구현입니다. 본편 프리뷰에는 검토용 ID·경로 가이드를 넣지 않았습니다.</p></main>
<script>const v=document.querySelector('video'),status=document.querySelector('output');const fs=[1,96,216,456,648,900,1200];fs.forEach((f,i)=>{let b=document.createElement('button');b.textContent='S'+(i+1);b.onclick=()=>{v.currentTime=(f-1)/12;v.play()};document.querySelector('#buttons').append(b)});for(const rate of [0.5,1,2]){let b=document.createElement('button');b.textContent=rate+'×';b.onclick=()=>v.playbackRate=rate;document.querySelector('#buttons').append(b)};v.addEventListener('timeupdate',()=>status.textContent=`${v.paused?'일시 정지':'재생 중'} · ${v.currentTime.toFixed(2)} / ${v.duration.toFixed(2)}초 · frame ${Math.floor(v.currentTime*12)+1}`);</script></html>
