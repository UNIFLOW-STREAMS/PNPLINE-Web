<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNPLINE · 선박 추적 카메라 개선</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111820;color:#e9edf1}body{max-width:1280px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin:8px 0}p{color:#b7c5d0;line-height:1.7}.eyebrow{color:#00add2;font-size:13px;letter-spacing:.12em}video{width:100%;display:block;background:#080c11;border-radius:8px}button,a{font:inherit}button{border:1px solid #526675;background:#1c2a36;color:#e9edf1;padding:10px 16px;border-radius:5px;cursor:pointer}button:hover,button:focus-visible{border-color:#00add2}a{color:#45cbe7}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0 12px}.label{margin:0 0 8px;color:#e9edf1}.readout{font-variant-numeric:tabular-nums;min-height:24px}footer{margin:30px 0;color:#a8bac7}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:0 16px;margin:24px auto}}
</style>
<body><div class="eyebrow">PNPLINE / CAMERA REVISION 01</div>
<h1>선박과 함께 끊김 없이 이동하도록</h1>
<p>미국 입항 전에 선박을 앞서 간 뒤 기다리던 카메라를 수정했습니다. 선박을 계속 화면에 두고 도시 공개와 측면 구도를 부드럽게 연결합니다. 33초 · 30fps입니다.</p>
<video id="full" controls preload="metadata" playsinline src="preview/pnpline-33s-ship-camera-v001.mp4" aria-label="수정된 전체 33초 영상"></video>
<nav><button id="segment">수정 구간 재생 · f200–f360</button><button id="all">처음부터 전체 재생</button><button id="stop">정지</button><a href="preview/pnpline-33s-ship-camera-v001.mp4" download>MP4 다운로드</a><a href="pnpline-33s-ship-camera-v001.blend" download>Blender 파일</a></nav>
<p id="frame" class="readout" aria-live="off">30fps · 990프레임</p>
<div class="grid"><section><p class="label">수정 전 · f200–f360</p><video id="before" muted playsinline preload="metadata" controls src="preview/before-f200-f360.mp4" aria-label="수정 전 비교 구간"></video></section><section><p class="label">수정 후 · f200–f360</p><video id="after" muted playsinline preload="metadata" controls src="preview/after-f200-f360.mp4" aria-label="수정 후 비교 구간"></video></section></div>
<nav><button id="compare">전후 함께 재생</button><button id="compareStop">비교 정지</button></nav>
<footer>선박 추적 유지 · 대기 구간 제거 · 지면 기준 롤 안정화 · 물류 동작 시점 유지</footer>
<script>
const full=document.getElementById('full'),before=document.getElementById('before'),after=document.getElementById('after');let segment=false;
document.getElementById('segment').onclick=()=>{segment=true;full.currentTime=200/30;full.play()};
document.getElementById('all').onclick=()=>{segment=false;full.currentTime=0;full.play()};
document.getElementById('stop').onclick=()=>full.pause();
full.addEventListener('timeupdate',()=>{document.getElementById('frame').textContent=`f${Math.min(989,Math.floor(full.currentTime*30))} / f989 · ${full.currentTime.toFixed(2)}초 / 33초`;if(segment&&full.currentTime>=361/30){full.pause();segment=false}});
document.getElementById('compare').onclick=()=>{full.pause();before.currentTime=after.currentTime=0;Promise.all([before.play(),after.play()])};
document.getElementById('compareStop').onclick=()=>{before.pause();after.pause()};
</script></body></html>
