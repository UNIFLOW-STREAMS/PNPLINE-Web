<!doctype html><html lang="ko"><meta charset="utf-8"><title>PNPLINE 전체 재생 검토</title><style>body{margin:18px;background:#151c23;color:white;font:16px system-ui}video{display:block;width:min(96vw,1120px);height:auto;max-height:78vh;background:black}button{padding:12px;margin:5px;font:inherit}a{color:#91d3ff}pre{white-space:pre-wrap}</style><h1>PNPLINE · 전체 1배속 재생</h1><button onclick="start('A')">A 58.04초 재생</button><button onclick="start('B')">B 54.42초 재생</button> <a href="review.html">비교 페이지</a><video id="movie" controls preload="metadata"></video><pre id="state">재생할 후보를 선택하세요.</pre><script>
const v=document.getElementById('movie'),label=document.getElementById('state');let variant='';function start(x){variant=x;v.src=`preview/candidate-${x}.mp4`;v.playbackRate=1;v.play()};function status(){let played=[];for(let i=0;i<v.played.length;i++)played.push([v.played.start(i),v.played.end(i)]);label.textContent=JSON.stringify({variant,time:v.currentTime,duration:v.duration,rate:v.playbackRate,ended:v.ended,paused:v.paused,played,error:v.error?.message??null})}v.addEventListener('timeupdate',status);v.addEventListener('ended',status);v.addEventListener('error',status);
</script></html>
